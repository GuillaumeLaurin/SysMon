name: Build Driver

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.preset }} — WDK ${{ matrix.wdk }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        preset: [ debug, release, wdm-debug, wdm-release ]
        wdk:
          - "10.0.22621.0"    # Windows 11 22H2
        include:
          - preset: debug
            artifact_suffix: kmdf-dbg
          - preset: release
            artifact_suffix: kmdf-rel
          - preset: wdm-debug
            artifact_suffix: wdm-dbg
          - preset: wdm-release
            artifact_suffix: wdm-rel

    steps:
      # --------------------------------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------------------------
      # 2. Cache WDK (installation takes ~5 min, cache it)
      # --------------------------------------------------------------------------
      - name: Cache WDK installer
        id: cache-wdk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\wdksetup.exe
          key: wdk-installer-${{ matrix.wdk }}-v1

      # --------------------------------------------------------------------------
      # 3. Install WDK if not cached
      # --------------------------------------------------------------------------
      - name: Download WDK installer ${{ matrix.wdk }}
        if: steps.cache-wdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $wdkUrl   = "https://go.microsoft.com/fwlink/?linkid=2196230"
          $installer = "$env:RUNNER_TEMP\wdksetup.exe"
          Write-Host "Downloading WDK..."
          Invoke-WebRequest -Uri $wdkUrl -OutFile $installer -UseBasicParsing
          Write-Host "Download complete."
        
      # --------------------------------------------------------------------------
      # 4. Install WDK if not cached
      # --------------------------------------------------------------------------   
      - name: Install WDK ${{ matrix.wdk }}
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\wdksetup.exe"
          Write-Host "Installing WDK..."
          Start-Process -FilePath $installer `
            -ArgumentList "/quiet", "/norestart" `
            -Wait -NoNewWindow
          Write-Host "WDK installed."

      # --------------------------------------------------------------------------
      # 5. Set up MSVC environment
      # --------------------------------------------------------------------------
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      # --------------------------------------------------------------------------
      # 6. Configure CMake
      # --------------------------------------------------------------------------
      - name: Configure (${{ matrix.preset }})
        run: |
          cmake --preset ${{ matrix.preset }} `
            -DWDK_VERSION="${{ matrix.wdk }}"

      # --------------------------------------------------------------------------
      # 7. Build
      # --------------------------------------------------------------------------
      - name: Build (${{ matrix.preset }})
        run: cmake --build --preset ${{ matrix.preset }}

      # --------------------------------------------------------------------------
      # 8. Verify outputs
      # --------------------------------------------------------------------------
      - name: Verify outputs
        shell: pwsh
        run: |
          $sys = Get-ChildItem -Recurse -Filter "*.sys" build/
          if ($sys.Count -eq 0) {
            Write-Error "No .sys file found — build failed"
            exit 1
          }
          $sys | ForEach-Object { Write-Host "  OK $($_.FullName)" }

          $client = Get-ChildItem -Recurse -Filter "SysMonClient.exe" build/
          if ($client.Count -eq 0) {
            Write-Error "SysMonClient.exe not found — build failed"
            exit 1
          }
          $client | ForEach-Object { Write-Host "  OK $($_.FullName)" }

      # --------------------------------------------------------------------------
      # 9. Package outputs into a zip per config
      # --------------------------------------------------------------------------
      - name: Package release assets
        shell: pwsh
        run: |
          $suffix = "${{ matrix.artifact_suffix }}"
          $preset = "${{ matrix.preset }}"
          $stage  = "staging"
          New-Item -ItemType Directory -Force $stage | Out-Null

          $filters = @("SysMon.sys", "SysMon.pdb", "SysMon.inf",
                       "SysMonClient.exe", "SysMonClient.pdb")

          foreach ($f in $filters) {
            $item = Get-ChildItem -Recurse "build/$preset" -Filter $f | Select-Object -First 1
            if ($item) {
              Copy-Item $item.FullName "$stage\"
              Write-Host "  + $($item.Name)"
            }
          }

          $zip = "SysMon-$suffix.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip
          Write-Host "Created $zip"

      # --------------------------------------------------------------------------
      # 10. Upload artifact
      # --------------------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: driver-${{ matrix.artifact_suffix }}-wdk${{ matrix.wdk }}
          path: SysMon-${{ matrix.artifact_suffix }}.zip
          retention-days: 30
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # Summary job (overall status badge)
  # ----------------------------------------------------------------------------
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "All builds passed."
          else
            echo "One or more builds failed."
            exit 1
          fi

  # ----------------------------------------------------------------------------
  # Release job — runs only on version tags (e.g. v1.0.0)
  # ----------------------------------------------------------------------------
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: false